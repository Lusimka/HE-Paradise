<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09070d">
  <meta name="description" content="HE Paradise — a modern profile switcher for Hall Effect keyboards.">
  <title>HE Paradise — Shark Lagoon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hurricane&family=IBM+Plex+Mono:wght@200;700&family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="background" aria-hidden="true">
    <video autoplay muted loop playsinline preload="auto">
      <source src="assets/background.mp4" type="video/mp4">
    </video>
    <div class="background-shade"></div>
  </div>

  <main class="page">
    <section class="card" aria-label="HE Paradise">
      <div class="brand">
        <img class="logo" src="assets/logo.png" alt="HE Paradise logo">
        <div class="brand-name">HE Paradise</div>
        <div class="lagoon">Shark Lagoon</div>
        <div class="version">beta v1.0</div>
      </div>

      <div class="tagline">
        <div>A modern profile switcher for</div>
        <strong>HALL EFFECTS KEYBOARDS</strong>
      </div>

      <div class="features">
        <div class="feature feature-auto">
          <div class="icon-box"><img src="assets/auto-blue.png" alt=""></div>
          <div class="feature-title">AUTO</div>
        </div>
        <div class="feature feature-shortcut">
          <div class="icon-box"><img src="assets/shortcut-purple.png" alt=""></div>
          <div class="feature-title">SHORTCUT</div>
        </div>
      </div>

      <a class="download" href="https://github.com/Lusimka/HE-Paradise/releases/download/v1.0/HE.Paradise.v1.0.zip" download>
        <span>DOWNLOAD</span>
      </a>

      <a class="kofi" href="https://ko-fi.com/heparadise" target="_blank" rel="noopener noreferrer">
        <img src="assets/kofi.png" alt="Support me on Ko-fi">
      </a>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
